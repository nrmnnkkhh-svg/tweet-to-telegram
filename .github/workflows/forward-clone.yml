name: Clone Channel Forward (Test)

on:
  workflow_dispatch:

jobs:
  forward:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run forwarder (clone channel)
        env:
          X_AUTH_TOKEN: ${{ secrets.X_AUTH_TOKEN }}
          X_CT0: ${{ secrets.X_CT0 }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT_ID: "@CloneIntlbrk"
          STATE_FILE: "state-clone.json"
          TEMPLATE_FILE: "template-clone.txt"
        run: python bot_clone.py

      - name: Commit clone state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state-clone.json
          git diff --staged --quiet || (git commit -m "Update clone state" && git push)
